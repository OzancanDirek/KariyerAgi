services:
  - type: web
    name: careerpath-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Supabase__Url
        sync: false
      - key: Supabase__PublishableKey
        sync: false
      - key: Supabase__SecretKey
        sync: false
      - key: Gemini__ApiKey
        sync: false
      - key: Web__Origin
        sync: false
  - type: web
    name: careerpath-web
    runtime: static
    buildCommand: npm ci --prefix apps/web && npm run build --prefix apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://careerpath-api-5k1f.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
